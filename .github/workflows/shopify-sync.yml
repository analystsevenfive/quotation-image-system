name: Shopify Catalog Sync to Supabase

on:
  schedule:
    # Runs every day at 12:00 UTC = 19:00 Bangkok / ICT (UTC+7)
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows one-click manual execution from GitHub Actions

jobs:
  sync:
    name: Sync Shopify Products to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/api/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Run Shopify Sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP || 'sevenfive-4062.myshopify.com' }}
          SHOPIFY_CLIENT_ID: ${{ secrets.CLIENT_ID || secrets.SHOPIFY_CLIENT_ID || '696e1e9162c702cc07c2f94a1beacf8a' }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET || secrets.CLIENT_SECRET }}
          PYTHONPATH: apps/api
        run: |
          python -m app.services.shopify_sync --no-json
