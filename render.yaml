services:
  - type: web
    name: quotation-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r apps/api/requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: apps/api
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: "*"
      - key: ALLOWED_ORIGINS
        value: "*"
